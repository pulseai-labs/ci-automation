name: Droid Automation

# Reusable workflow: the single orchestration artifact for every droid-driven
# automation across pulseai-labs. See ADR-0001 in draco-hub-macos-server.
#
# This repository is PUBLIC by necessity, not preference: a public repo can only
# consume reusable workflows from public repos, and no Access setting on a
# private repo overrides that. It carries no secrets — credentials are minted on
# the runner from a root-owned key the runner itself cannot read.
#
# INPUT HANDLING
# Every input is treated as hostile. On the repository_dispatch path these
# values originate in client_payload, which is attacker-settable by anyone
# holding the dispatch credential. So:
#   - inputs are never interpolated directly into `run:` — they go through env:
#   - inputs used as a checkout `ref:` are pattern-validated first and the job
#     fails closed on anything unexpected
#   - the validation step runs before any checkout of untrusted content
# See: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  workflow_call:
    inputs:
      automations:
        description: 'Comma-separated: qa, code-review, security-audit'
        type: string
        required: true
      target-repo:
        description: 'owner/repo to analyse. Empty = the calling repository.'
        type: string
        default: ''
      target-ref:
        description: 'SHA or ref of the target to check out.'
        type: string
        default: ''
      comment-on:
        description: 'owner/repo to post the report to. Empty = no comment.'
        type: string
        default: ''
      comment-issue:
        description: 'PR or issue number to comment on.'
        type: string
        default: ''
      runner:
        description: 'runs-on value. Defaults to the mac mini.'
        type: string
        default: 'self-hosted'
      model:
        description: 'droid model id as configured on the runner.'
        type: string
        default: 'zai-coding-plan/glm-5.2'
      report-status:
        description: >-
          Post a commit status to `comment-on` at `target-ref`, making this
          automation a merge gate rather than an advisory comment. Requires
          target-ref to be a 40-hex SHA. Context is `droid/<automation>`.
        type: boolean
        default: false
      timeout-minutes:
        description: 'Hard cap per automation.'
        type: number
        default: 25

# One runner, one job at a time. Without this, three automations across
# fourteen repos would serialize into hours and start hitting GitHub's 24h
# queue cancellation.
concurrency:
  group: droid-${{ github.repository }}-${{ inputs.target-ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate inputs
    runs-on: ubuntu-latest
    outputs:
      automations: ${{ steps.v.outputs.automations }}
      target_repo: ${{ steps.v.outputs.target_repo }}
      target_ref: ${{ steps.v.outputs.target_ref }}
      comment_on: ${{ steps.v.outputs.comment_on }}
      comment_issue: ${{ steps.v.outputs.comment_issue }}
      model: ${{ steps.v.outputs.model }}
    steps:
      # Runs on a hosted runner, before the mini is involved at all, and before
      # any untrusted content is checked out. Fails closed.
      - id: v
        shell: bash
        env:
          IN_AUTOMATIONS: ${{ inputs.automations }}
          IN_TARGET_REPO: ${{ inputs.target-repo }}
          IN_TARGET_REF: ${{ inputs.target-ref }}
          IN_COMMENT_ON: ${{ inputs.comment-on }}
          IN_COMMENT_ISSUE: ${{ inputs.comment-issue }}
          IN_MODEL: ${{ inputs.model }}
          IN_REPORT_STATUS: ${{ inputs.report-status }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Allowlist, not a denylist. Anything unrecognised stops the run.
          LIST=""
          IFS=','
          for a in $IN_AUTOMATIONS; do
            a="$(printf '%s' "$a" | tr -d '[:space:]')"
            [ -n "$a" ] || continue
            case "$a" in
              qa|code-review|security-audit) ;;
              *) fail "unknown automation '$a'" ;;
            esac
            LIST="${LIST:+$LIST,}$a"
          done
          unset IFS
          [ -n "$LIST" ] || fail "no valid automations requested"

          # owner/repo, conservative charset.
          for v in "$IN_TARGET_REPO" "$IN_COMMENT_ON"; do
            [ -z "$v" ] && continue
            printf '%s' "$v" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$' \
              || fail "malformed repository '$v'"
          done

          # A ref becomes a checkout target, so it is the highest-risk input.
          # 40-hex SHA, or a conservative branch/tag charset. No spaces, no
          # shell metacharacters, no leading dash, no '..'.
          if [ -n "$IN_TARGET_REF" ]; then
            printf '%s' "$IN_TARGET_REF" | grep -Eq '^([0-9a-f]{40}|[A-Za-z0-9][A-Za-z0-9._/-]{0,254})$' \
              || fail "malformed ref"
            case "$IN_TARGET_REF" in *..*) fail "ref may not contain '..'" ;; esac
          fi

          [ -z "$IN_COMMENT_ISSUE" ] || printf '%s' "$IN_COMMENT_ISSUE" | grep -Eq '^[0-9]{1,10}$' \
            || fail "comment-issue must be numeric"

          printf '%s' "$IN_MODEL" | grep -Eq '^[A-Za-z0-9:._/-]{1,64}$' || fail "malformed model id"

          if [ -n "$IN_COMMENT_ON" ] && [ -z "$IN_COMMENT_ISSUE" ]; then
            fail "comment-on set without comment-issue"
          fi

          # A commit status attaches to a specific commit, so a branch name will
          # not do. Fail closed rather than posting a status nobody can see.
          if [ "$IN_REPORT_STATUS" = "true" ]; then
            [ -n "$IN_COMMENT_ON" ] || fail "report-status needs comment-on (the repo to report to)"
            printf '%s' "$IN_TARGET_REF" | grep -Eq '^[0-9a-f]{40}$' \
              || fail "report-status needs target-ref to be a 40-hex SHA, got '''$IN_TARGET_REF'''"
          fi

          {
            printf 'automations=["%s"]\n' "$(printf '%s' "$LIST" | sed 's/,/","/g')"
            printf 'target_repo=%s\n'   "$IN_TARGET_REPO"
            printf 'target_ref=%s\n'    "$IN_TARGET_REF"
            printf 'comment_on=%s\n'    "$IN_COMMENT_ON"
            printf 'comment_issue=%s\n' "$IN_COMMENT_ISSUE"
            printf 'model=%s\n'         "$IN_MODEL"
          } >>"$GITHUB_OUTPUT"
          echo "validated: $LIST"

  droid:
    needs: validate
    name: ${{ matrix.automation }}
    runs-on: ${{ fromJSON(format('["{0}"]', inputs.runner)) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        automation: ${{ fromJSON(needs.validate.outputs.automations) }}
    permissions:
      contents: read

    steps:
      # Posted BEFORE any work, so a PR shows the gate as in-progress rather
      # than as a missing check while the single runner drains its queue.
      - name: Report status pending
        if: inputs.report-status
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
          STATUS_REPO: ${{ needs.validate.outputs.comment_on }}
          STATUS_SHA: ${{ needs.validate.outputs.target_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOK="$(sudo -n /usr/local/libexec/pulseai-mint-token status-token "$STATUS_REPO")"
          trap 'curl -s -o /dev/null -X DELETE -H "Authorization: token $TOK" https://api.github.com/installation/token || true' EXIT
          jq -n --arg c "droid/$AUTOMATION" --arg u "$RUN_URL" \
             '{state:"pending",context:$c,target_url:$u,description:"running on the self-hosted runner"}' \
            | curl -sS --retry 3 --retry-all-errors -o /dev/null -X POST \
                   -H "Authorization: token $TOK" -H "Accept: application/vnd.github+json" \
                   -d @- "https://api.github.com/repos/$STATUS_REPO/statuses/$STATUS_SHA"
          echo "posted droid/$AUTOMATION = pending"

      # The hub itself: prompts, pinned to the exact commit of THIS reusable
      # workflow. Must be job_workflow_sha, not workflow_sha: the latter is the
      # CALLER's commit, which does not exist in this repository — checking it
      # out fails with "upload-pack: not our ref".
      - name: Check out ci-automation
        uses: actions/checkout@v5
        with:
          repository: pulseai-labs/ci-automation
          ref: ${{ github.job_workflow_sha }}
          path: .ci-automation
          persist-credentials: false

      # The calling repository, which owns the curated .factory/skills for this
      # project. Skills are per-project and never installed globally.
      - name: Check out skills (calling repository)
        uses: actions/checkout@v5
        with:
          path: workspace
          persist-credentials: false

      # Untrusted content. The ref was validated above; persist-credentials is
      # false so no token lands on disk next to attacker-authored files.
      - name: Check out analysis target
        if: needs.validate.outputs.target_repo != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.validate.outputs.target_repo }}
          ref: ${{ needs.validate.outputs.target_ref }}
          path: workspace/target
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve prompt and autonomy
        if: matrix.automation != 'code-review'
        id: cfg
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
        run: |
          set -euo pipefail
          P=".ci-automation/prompts/${AUTOMATION}.md"
          test -f "$P" || { echo "::error::missing prompt $P"; exit 1; }
          echo "prompt=$P" >>"$GITHUB_OUTPUT"
          # Autonomy is set centrally per automation so it cannot drift per-repo.
          # Each tier is chosen from what the automation ACTUALLY DOES, not from
          # a general preference for less. An earlier version applied a
          # least-privilege instinct without checking, set qa to medium, and
          # broke it: droid returned "insufficient permission to proceed.
          # Re-run with --auto high".
          #
          #   low     file create/modify. No system changes.
          #   medium  + package installs, network, local git, BUILDING code.
          #           Still blocks git push and sudo.
          #   high    + running arbitrary/untrusted code. "Allows ALL operations
          #           without confirmation" — droid's own words.
          #
          # qa compiles AND EXECUTES consumer-simulation test programs. Running
          # a compiled binary is arbitrary code execution, so high is the floor,
          # not a convenience. See the runner-isolation note below.
          #
          # code-review and security-audit are read-first analysers, but a
          # reviewer legitimately runs `cargo check` to confirm a claim, and
          # low blocks that. medium still forbids push and sudo.
          case "$AUTOMATION" in
            qa)             echo "autonomy=high"   >>"$GITHUB_OUTPUT" ;;
            code-review)    echo "autonomy=medium" >>"$GITHUB_OUTPUT" ;;
            security-audit) echo "autonomy=medium" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::unreachable"; exit 1 ;;
          esac
          # RESIDUAL RISK, stated so it is not forgotten: droid documents
          # --auto high as "only use in isolated environments (Docker, throwaway
          # VMs)". This runner is a persistent macOS account whose _work
          # directory is not wiped between jobs. Present containment is: a
          # non-admin user, no GitHub credential in droid's environment, and a
          # per-job workspace wipe. Ephemeral runner registration is the
          # remaining mitigation and is not yet in place.

      - name: Verify curated skill is present
        if: matrix.automation != 'code-review'
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
          CALLER: ${{ github.repository }}
        run: |
          set -euo pipefail
          D="workspace/.factory/skills/${AUTOMATION}"
          if [ ! -d "$D" ]; then
            echo "::error::no curated skill at $D in ${CALLER}."
            echo "::error::Skills are per-project. Add one, or drop '${AUTOMATION}' from the automations input."
            exit 1
          fi
          echo "found $(find workspace/.factory/skills -name SKILL.md | wc -l | tr -d ' ') SKILL.md file(s)"

      # The custom review agent (agent/) replaces droid for code-review only.
      # It runs with NO GitHub credential in its environment. It reads
      # attacker-influenceable text (diffs, PR bodies); a prompt injection that
      # succeeds must find no token to exfiltrate and no write path to use.
      # qa and security-audit still use droid — see the "Run droid" step below.
      - name: Run review agent
        if: matrix.automation == 'code-review'
        id: run
        shell: bash
        working-directory: workspace
        env:
          TARGET_DIR: ${{ github.workspace }}/workspace/target
          OUT_DIR: ${{ github.workspace }}/report
          BASE_REF: origin/main
          MODEL: ${{ needs.validate.outputs.model }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          mkdir -p "$OUT_DIR"
          cd ../.ci-automation/agent
          bun install --frozen-lockfile
          bun run src/review.ts
          echo "rc=$?" >>"$GITHUB_OUTPUT"

      # The custom agent writes report.md and result.json into OUT_DIR. The
      # downstream Publish/Comment steps expect report/${AUTOMATION}.md, so copy
      # it to match the convention droid uses.
      - name: Stage review output
        if: matrix.automation == 'code-review' && always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/report/report.md" ]; then
            cp "$GITHUB_WORKSPACE/report/report.md" "$GITHUB_WORKSPACE/report/code-review.md"
          fi

      # droid runs with NO GitHub credential in its environment. It reads
      # attacker-influenceable text (diffs, PR bodies); a prompt injection that
      # succeeds must find no token to exfiltrate and no write path to use.
      # Used by qa and security-audit; code-review uses the custom agent above.
      - name: Run droid
        if: matrix.automation != 'code-review'
        id: run-droid
        shell: bash
        working-directory: workspace
        env:
          AUTOMATION: ${{ matrix.automation }}
          AUTONOMY: ${{ steps.cfg.outputs.autonomy }}
          PROMPT: ${{ steps.cfg.outputs.prompt }}
          MODEL: ${{ needs.validate.outputs.model }}
          FACTORY_DISABLE_KEYRING: '1'
          FACTORY_HOME_OVERRIDE: /Users/github-runner
          FACTORY_DROID_AUTO_UPDATE_ENABLED: '0'
          FACTORY_LOG_MAX_DAYS: '7'
          FACTORY_LOG_MAX_TOTAL_BYTES: '268435456'
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          mkdir -p ../report
          /usr/local/bin/droid exec \
            --auto "$AUTONOMY" \
            -m "$MODEL" \
            --disable-builtin-skills \
            -f "../$PROMPT" \
            2>&1 | tee "../report/${AUTOMATION}.md"
          echo "rc=${PIPESTATUS[0]}" >>"$GITHUB_OUTPUT"

      - name: Publish report to the run summary
        if: always()
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
        run: |
          F="report/${AUTOMATION}.md"
          {
            echo "## ${AUTOMATION}"
            echo
            if [ -s "$F" ]; then tail -c 60000 "$F"; else echo '_no output_'; fi
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droid-${{ matrix.automation }}
          path: report/
          retention-days: 14

      # Cross-repo comment. GITHUB_TOKEN cannot do this — it is scoped to the
      # calling repository. The token is minted by a root helper that accepts no
      # permission arguments, used once, then revoked.
      - name: Comment the report
        if: always() && needs.validate.outputs.comment_on != ''
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
          COMMENT_ON: ${{ needs.validate.outputs.comment_on }}
          COMMENT_ISSUE: ${{ needs.validate.outputs.comment_issue }}
          MODEL: ${{ needs.validate.outputs.model }}
        run: |
          set -euo pipefail
          F="report/${AUTOMATION}.md"
          if [ ! -s "$F" ]; then
            echo "no report to post (earlier step failed or produced nothing)"
            exit 0
          fi
          TOK="$(sudo -n /usr/local/libexec/pulseai-mint-token comment-token "$COMMENT_ON")"
          trap 'curl -s -o /dev/null -X DELETE -H "Authorization: token $TOK" https://api.github.com/installation/token || true' EXIT
          # droid emits markdown. Wrapping it in a code fence — which an
          # earlier version did — renders headings, bold and lists as literal
          # text and is the reason these comments were unreadable. Render it as
          # markdown, and surface the verdict in the heading and the <summary>
          # so the outcome is visible without expanding.
          REPORT="$(cat "$F")"

          # Strip any closing </details> the report might contain, which would
          # otherwise break out of the collapsible block.
          REPORT="$(printf '%s' "$REPORT" | sed 's#</details>##g')"

          # Distinguish INFRASTRUCTURE failure from a code finding. Observed:
          # Z.AI session quota exhaustion surfaces as droid's generic
          # "Exec failed", which is indistinguishable from a real QA failure —
          # so a quota reset window looked exactly like bad code, on a check
          # that gates merges.
          INFRA=""
          case "$REPORT" in
            *"No active subscription"*|*"Payment Required"*|*402*) INFRA="model subscription/payment" ;;
            *"rate limit"*|*"quota"*|*429*)                        INFRA="model quota or rate limit" ;;
            *"Exec failed"*)                                       INFRA="droid exec failed (commonly model quota)" ;;
            *"insufficient permission"*)                           INFRA="autonomy tier too low for this automation" ;;
          esac

          VERDICT="$(printf '%s' "$REPORT" \
            | grep -ioE '(VERDICT|Verdict)[: ]+[A-Z][A-Z_-]*' \
            | head -1 | grep -oE '[A-Z][A-Z_-]*$' || true)"
          if [ -n "$INFRA" ]; then
            ICON='🔌'; VERDICT="NOT RUN — $INFRA"
          else
            case "$VERDICT" in
              PASS)          ICON='✅' ;;
              FAIL|FAILED)   ICON='❌' ;;
              INCONCLUSIVE)  ICON='⚠️' ;;
              *)             ICON='🤖'; VERDICT='report' ;;
            esac
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # A blank line after <summary> is required for GitHub to render
          # markdown inside <details>.
          BODY="$(printf '## %s droid %s — %s\n\n<details>\n<summary><b>Full report</b></summary>\n\n%s\n\n</details>\n\n<sub>model <code>%s</code> · <a href="%s">run log</a> · reported by the self-hosted runner</sub>\n' \
                  "$ICON" "$AUTOMATION" "$VERDICT" "$REPORT" "$MODEL" "$RUN_URL")"

          jq -n --arg b "$BODY" '{body:$b}' >/tmp/droid-comment-$$.json
          RC=0
          CODE="$(curl --show-error --silent --output /tmp/droid-comment-resp-$$.txt \
                  --write-out '%{http_code}' \
                  --retry 4 --retry-delay 3 --retry-all-errors \
                  --connect-timeout 15 --max-time 60 \
                  -X POST -H "Authorization: token $TOK" \
                  -H "Accept: application/vnd.github+json" \
                  -d @/tmp/droid-comment-$$.json \
                  "https://api.github.com/repos/${COMMENT_ON}/issues/${COMMENT_ISSUE}/comments")" || RC=$?
          rm -f /tmp/droid-comment-$$.json

          if [ "$RC" -ne 0 ]; then
            echo "::warning::curl failed with exit $RC after retries (56 = receive error, usually the Wi-Fi link)"
            head -c 400 /tmp/droid-comment-resp-$$.txt 2>/dev/null || true
            rm -f /tmp/droid-comment-resp-$$.txt
            exit 1
          fi
          if [ "$CODE" != "201" ]; then
            echo "::warning::GitHub returned HTTP $CODE"
            head -c 400 /tmp/droid-comment-resp-$$.txt 2>/dev/null || true
            rm -f /tmp/droid-comment-resp-$$.txt
            exit 1
          fi
          rm -f /tmp/droid-comment-resp-$$.txt
          echo "comment posted to ${COMMENT_ON}#${COMMENT_ISSUE}"

      # always(): if this step is skipped the PR sits on `pending` forever and
      # the branch is unmergeable with no indication why. A gate that can hang
      # is worse than no gate.
      - name: Report status final
        if: always() && inputs.report-status
        shell: bash
        env:
          AUTOMATION: ${{ matrix.automation }}
          STATUS_REPO: ${{ needs.validate.outputs.comment_on }}
          STATUS_SHA: ${{ needs.validate.outputs.target_ref }}
          STEP_RC: ${{ steps.run.outputs.rc }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          F="report/${AUTOMATION}.md"

          # For code-review the verdict comes from result.json (written by the
          # custom agent). An absent/empty result.json is a hard error: the
          # orchestrator produced no verdict, so the gate must fail-closed
          # rather than fall through to the qa/security-audit markdown logic
          # (which would resolve to the job status and thus fail-open). For qa
          # and security-audit the verdict is parsed from the report markdown
          # that droid produced — that logic is kept verbatim in the else branch.
          if [ "$AUTOMATION" = "code-review" ]; then
            if [ ! -s "$GITHUB_WORKSPACE/report/result.json" ]; then
              STATE=error; DESC="orchestrator produced no result.json"
            else
              V="$(jq -r '.verdict' "$GITHUB_WORKSPACE/report/result.json")"
              D="$(jq -r '.reason' "$GITHUB_WORKSPACE/report/result.json")"
              case "$V" in
                PASS)          STATE=success; DESC="$D" ;;
                FAIL)          STATE=failure; DESC="$D" ;;
                INCONCLUSIVE)  STATE=success; DESC="$D" ;;
                *)             STATE=error;   DESC="$D" ;;
              esac
            fi
          else
            VERDICT="$(grep -ioE '(VERDICT|Verdict)[: ]+[A-Z][A-Z_-]*' "$F" 2>/dev/null \
                       | head -1 | grep -oE '[A-Z][A-Z_-]*$' || true)"

            # The agent's own verdict decides the gate where it gave one; the job
            # outcome decides otherwise. INCONCLUSIVE is deliberately NOT a
            # failure — "no library code changed" must not block a merge.
            # An infrastructure failure still BLOCKS — we do not know whether the
            # code is good — but it is reported as `error`, not `failure`, and
            # says so plainly. Otherwise a quota reset window is indistinguishable
            # from bad code on a check that gates merges, and the reviewer debugs
            # the diff instead of waiting an hour.
            INFRA=""
            if [ -f "$F" ]; then
              case "$(cat "$F")" in
                *"No active subscription"*|*"Payment Required"*) INFRA="model subscription/payment — NOT a code finding" ;;
                *"rate limit"*|*"quota"*)                        INFRA="model quota/rate limit — NOT a code finding" ;;
                *"Exec failed"*)                                 INFRA="droid exec failed, commonly model quota — NOT a code finding" ;;
                *"insufficient permission"*)                     INFRA="autonomy tier too low — NOT a code finding" ;;
              esac
            fi

            if [ -n "$INFRA" ]; then
              STATE=error; DESC="$INFRA"
            else
              case "${VERDICT:-}" in
                PASS)          STATE=success; DESC="PASS" ;;
                FAIL|FAILED)   STATE=failure; DESC="FAIL — see the report comment" ;;
                INCONCLUSIVE)  STATE=success; DESC="inconclusive (not applicable to this diff)" ;;
                *) if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESC="completed";
                   else STATE=failure; DESC="job ${JOB_STATUS}"; fi ;;
              esac
            fi
          fi

          TOK="$(sudo -n /usr/local/libexec/pulseai-mint-token status-token "$STATUS_REPO")"
          trap 'curl -s -o /dev/null -X DELETE -H "Authorization: token $TOK" https://api.github.com/installation/token || true' EXIT
          jq -n --arg s "$STATE" --arg c "droid/$AUTOMATION" --arg u "$RUN_URL" --arg d "$DESC" \
             '{state:$s,context:$c,target_url:$u,description:$d}' \
            | curl -sS --retry 3 --retry-all-errors -o /dev/null -X POST \
                   -H "Authorization: token $TOK" -H "Accept: application/vnd.github+json" \
                   -d @- "https://api.github.com/repos/$STATUS_REPO/statuses/$STATUS_SHA"
          echo "posted droid/$AUTOMATION = $STATE ($DESC)"

      # _work is not wiped between jobs. Leave nothing for the next one.
      - name: Clean workspace
        if: always()
        shell: bash
        run: rm -rf workspace report .ci-automation || true
